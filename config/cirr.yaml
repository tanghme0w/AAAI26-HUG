# Configuration for CIRR Dataset

# Dataset settings
dataset: cirr
data_root: /mnt/jfs/hypertext-du/tanghaomiao/cir/CIRR

# Model settings
num_queries: 32
hidden_dim: 768
blip_model: Salesforce/blip2-opt-2.7b
freeze_vision_encoder: true

# Training settings
batch_size: 32
num_epochs: 30
learning_rate: 3.0e-5
weight_decay: 0.01
warmup_epochs: 2

# Optimizer settings
optimizer:
  type: AdamW
  beta1: 0.9
  beta2: 0.999

# Loss settings
lambda_fc: 0.5
lambda_cord: 0.1
margin_cord: 0.2
temperature_fc: 0.07

# Data settings
image_size: 224
num_workers: 4

# Logging settings
log_interval: 10
save_interval: 1
output_dir: ./checkpoints/cirr

# Random seed
seed: 42
